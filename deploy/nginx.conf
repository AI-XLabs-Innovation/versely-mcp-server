# nginx vhost for versely-mcp
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/versely-mcp
#   sudo ln -sf /etc/nginx/sites-available/versely-mcp /etc/nginx/sites-enabled/versely-mcp
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue TLS with:
#   sudo certbot --nginx -d versely-mcp.YOURDOMAIN.com
# (certbot will rewrite the listen directives below to enable HTTPS)
#
# Replace `versely-mcp.YOURDOMAIN.com` everywhere before deploying.

server {
    listen 80;
    listen [::]:80;
    server_name versely-mcp.YOURDOMAIN.com;

    # certbot will redirect this to HTTPS automatically once it issues a cert.
    # Until then, the server speaks plain HTTP — keep this minimal vhost so the
    # ACME http-01 challenge can succeed.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After `certbot --nginx -d versely-mcp.YOURDOMAIN.com` runs, it appends an
# additional `server { listen 443 ssl ... }` block automatically. The settings
# below are what that block should ultimately contain — copy them across once
# certbot has scaffolded the TLS server.
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name versely-mcp.YOURDOMAIN.com;
