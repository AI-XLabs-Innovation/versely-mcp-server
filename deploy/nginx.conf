#     ssl_certificate_key /etc/letsencrypt/live/versely-mcp.YOURDOMAIN.com/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#     # MCP request bodies are small; 8mb is generous.
#     client_max_body_size 8m;
#
#     proxy_http_version 1.1;
#     proxy_set_header Host              $host;
#     proxy_set_header X-Real-IP         $remote_addr;
#     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto https;
#     proxy_set_header X-Forwarded-Host  $host;
#
#     # `mode: "wait"` on slow video models can take a few minutes.
#     proxy_read_timeout    300s;
#     proxy_send_timeout    300s;
#     proxy_connect_timeout  10s;
#
#     # Streamable HTTP can stream SSE — never buffer or cache.
#     proxy_buffering off;
#     proxy_cache    off;
